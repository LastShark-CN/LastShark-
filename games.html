<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小游戏 · LastShark</title>
<meta name="description" content="小游戏板块：内置一个可直接试玩的像素小游戏，其余为待补全的游戏展示位。">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
</head>
<body data-page="games" data-list="games">

<!-- SECTION: bg-markup -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="bg-fallback" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquidWarp">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="shell">

  <nav class="crumbs rv" aria-label="面包屑">
    <a href="index.html">首页</a><i>/</i><span id="crumb-title">小游戏</span>
  </nav>

  <main>
    <!-- SECTION: playable -->
    <section id="stage">
      <div class="sec-head rv">
        <div>
          <div class="sec-kicker">Playable Now</div>
          <h2 class="sec-title">内置试玩 · 方块矿工</h2>
        </div>
        <p class="sec-note">键盘 ← → 或 A / D 移动，手机上按住两侧方向键或直接在画布上拖动。接住绿色与金色矿石得分，躲开红色 TNT，粉色爱心回血。</p>
        <span class="placeholder-flag">1 个可玩 + 1 个可下载 + 3 个待补全</span>
      </div>
      <div class="game-wrap">
        <div class="game-stage gcard rv">
          <div class="game-hud">
            <div class="hud-item">得分<b id="hud-score">0</b></div>
            <div class="hud-item">最高<b id="hud-best">0</b></div>
            <div class="hud-item">生命<b id="hud-lives">3</b></div>
          </div>
          <canvas id="game-canvas" width="200" height="280" tabindex="0" aria-label="方块矿工游戏画布"></canvas>
          <div class="game-ctrl">
            <button class="pad-btn" type="button" id="pad-left" aria-label="向左移动">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="btn btn-primary" type="button" id="game-toggle" style="min-width:132px">开始游戏</button>
            <button class="pad-btn" type="button" id="pad-right" aria-label="向右移动">
              <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <p class="game-tip">最高分保存在当前浏览器本地。这是示例小游戏，可在 data.js 与 game.js 中替换为你自己的游戏。</p>
        </div>
        <div class="game-list rv rv-d1" id="game-list"></div>
      </div>
    </section>

    <!-- SECTION: game-cards -->
    <section id="games">
      <div class="sec-head rv">
        <div>
          <div class="sec-kicker">All Games</div>
          <h2 class="sec-title">全部小游戏</h2>
        </div>
        <p class="sec-note">卡片只显示标题与封面图，点击进入详情页；可试玩的会直接跳到上方游戏区。</p>
        <span class="placeholder-flag" id="list-count">游戏位待替换</span>
      </div>
      <div class="filter-row rv rv-d1" id="list-filters"></div>
      <div class="card-grid" id="list-grid"></div>
    </section>
  </main>

  <!-- SECTION: footer -->
  <footer class="foot">
    <div class="foot-in">
      <p><span id="foot-text">© LastShark</span> · <span id="year">2026</span></p>
      <div class="foot-links">
        <a href="index.html">首页</a>
        <a href="photos.html">照片墙</a>
        <a href="articles.html">文章</a>
        <a href="mods.html">模组</a>
      </div>
    </div>
  </footer>
</div>

<!-- SECTION: nav-dock -->
<nav class="dock" id="dock" aria-label="主导航">
  <div class="dock-glass" aria-hidden="true"></div>
  <div class="dock-list" id="dock-list">
    <i class="dock-ind" id="dock-ind" aria-hidden="true"></i>
    <button class="nav-item" type="button" data-target="home" data-href="index.html">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 19z"/><path d="M10 20v-5h4v5"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" type="button" data-target="photos" data-href="photos.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.4"/><circle cx="9" cy="10.2" r="1.7"/><path d="M4.4 17.2l4.8-3.8 3.6 2.8 2.8-2 3.9 3"/></svg>
      <span>照片墙</span>
    </button>
    <button class="nav-item" type="button" data-target="articles" data-href="articles.html">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.6 3.7V7.4h3.6"/><path d="M9 12h7M9 15.6h5"/></svg>
      <span>文章</span>
    </button>
    <button class="nav-item" type="button" data-target="mods" data-href="mods.html">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.4v9.2L12 21l-8-4.4V7.4z"/><path d="M4 7.4l8 4.4 8-4.4M12 11.8V21"/></svg>
      <span>模组</span>
    </button>
    <button class="nav-item" type="button" data-target="games" data-href="games.html">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="19" height="10" rx="4.2"/><path d="M7 10.8v3.4M5.3 12.5h3.4"/><circle cx="16" cy="11.6" r="1.05"/><circle cx="18.2" cy="14" r="1.05"/></svg>
      <span>小游戏</span>
    </button>
  </div>
</nav>

<!-- SECTION: back-to-top -->
<button class="to-top" type="button" id="to-top" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/game.js"></script>
<script src="assets/js/list.js"></script>
<script src="assets/js/background.js"></script>
</body>
</html>
