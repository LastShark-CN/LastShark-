<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LastShark · 个人博客</title>
<meta name="description" content="LastShark 个人博客：照片墙、文章、我的世界模组与小游戏四个板块。">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
</head>
<body data-page="home">

<!-- SECTION: bg-markup -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="bg-fallback" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquidWarp">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="shell">

  <!-- SECTION: hero -->
  <header class="hero" id="home">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="hero-badge rv"><i class="hero-dot"></i><span id="hero-status">框架已就绪 · 内容待补全</span></div>
        <h1 class="rv rv-d1">Last<span class="glow">Shark</span></h1>
        <p class="hero-sub rv rv-d2" id="hero-desc">这里是个人博客的骨架版本。</p>
        <div class="hero-meta rv rv-d2" id="hero-chips"></div>
        <div class="hero-cta rv rv-d3">
          <button class="btn btn-primary" type="button" id="cta-photos">进入照片墙</button>
          <button class="btn btn-ghost" type="button" id="cta-games">试玩小游戏</button>
        </div>
      </div>
      <div class="avatar-plate rv rv-d2">
        <div class="avatar-ring"></div>
        <div class="avatar-core"><span>头像占位<br>AVATAR</span></div>
        <i class="avatar-orb"></i>
      </div>
    </div>
  </header>

  <main>
    <!-- SECTION: entries -->
    <section id="entries">
      <div class="sec-head rv">
        <div>
          <div class="sec-kicker">Sections</div>
          <h2 class="sec-title">四个板块</h2>
        </div>
        <p class="sec-note">每个板块都是独立页面，通过下方导航栏或这些入口卡进入。</p>
      </div>
      <div class="entry-grid" id="entry-grid"></div>
    </section>

    <!-- SECTION: latest -->
    <section id="latest">
      <div class="sec-head rv">
        <div>
          <div class="sec-kicker">Latest Writing</div>
          <h2 class="sec-title">最新文章</h2>
        </div>
        <p class="sec-note">只展示标题与封面，点击进入详情页阅读。</p>
        <a class="btn btn-ghost" href="articles.html" style="min-height:42px;padding:0 20px;font-size:13.4px">全部文章</a>
      </div>
      <div class="card-grid" id="latest-grid"></div>
    </section>
  </main>

  <!-- SECTION: footer -->
  <footer class="foot">
    <div class="foot-in">
      <p><span id="foot-text">© LastShark</span> · <span id="year">2026</span></p>
      <div class="foot-links">
        <a href="photos.html">照片墙</a>
        <a href="articles.html">文章</a>
        <a href="mods.html">模组</a>
        <a href="games.html">小游戏</a>
      </div>
    </div>
  </footer>
</div>

<!-- SECTION: nav-dock -->
<nav class="dock" id="dock" aria-label="主导航">
  <div class="dock-glass" aria-hidden="true"></div>
  <div class="dock-list" id="dock-list">
    <i class="dock-ind" id="dock-ind" aria-hidden="true"></i>
    <button class="nav-item" type="button" data-target="home" data-href="index.html">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 19z"/><path d="M10 20v-5h4v5"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" type="button" data-target="photos" data-href="photos.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.4"/><circle cx="9" cy="10.2" r="1.7"/><path d="M4.4 17.2l4.8-3.8 3.6 2.8 2.8-2 3.9 3"/></svg>
      <span>照片墙</span>
    </button>
    <button class="nav-item" type="button" data-target="articles" data-href="articles.html">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.6 3.7V7.4h3.6"/><path d="M9 12h7M9 15.6h5"/></svg>
      <span>文章</span>
    </button>
    <button class="nav-item" type="button" data-target="mods" data-href="mods.html">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.4v9.2L12 21l-8-4.4V7.4z"/><path d="M4 7.4l8 4.4 8-4.4M12 11.8V21"/></svg>
      <span>模组</span>
    </button>
    <button class="nav-item" type="button" data-target="games" data-href="games.html">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="19" height="10" rx="4.2"/><path d="M7 10.8v3.4M5.3 12.5h3.4"/><circle cx="16" cy="11.6" r="1.05"/><circle cx="18.2" cy="14" r="1.05"/></svg>
      <span>小游戏</span>
    </button>
  </div>
</nav>

<!-- SECTION: back-to-top -->
<button class="to-top" type="button" id="to-top" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/home.js"></script>
<script src="assets/js/background.js"></script>
</body>
</html>
