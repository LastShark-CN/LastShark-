<body data-page="mods" data-list="mods">

<!-- SECTION: bg-markup -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="bg-fallback" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquidWarp">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="shell">

  <nav class="crumbs rv" aria-label="面包屑">
    <a href="index.html">首页</a><i>/</i><span id="crumb-title">我的世界模组</span>
  </nav>

  <main>
    <!-- SECTION: mod-list -->
    <section id="mods">
      <div class="sec-head rv">
        <div>
          <div class="sec-kicker">Minecraft Mods</div>
          <h2 class="sec-title">我的世界模组</h2>
        </div>
        <p class="sec-note">列表只显示模组名与封面图，按加载器筛选，点击进入详情页查看版本与下载入口。</p>
        <span class="placeholder-flag" id="list-count">模组位待替换</span>
      </div>
      <div class="filter-row rv rv-d1" id="list-filters"></div>
      <div class="card-grid" id="list-grid"></div>

      <details class="install-note rv rv-d2">
        <summary>模组安装说明（占位文本，可替换为你自己的指引）</summary>
        <ol>
          <li>确认游戏版本与加载器类型（Forge / Fabric / NeoForge）与模组一致。</li>
          <li>下载对应版本的加载器并安装到官方启动器。</li>
          <li>把模组 .jar 文件放入游戏目录的 mods 文件夹。</li>
          <li>启动游戏，在模组列表中确认已加载；如遇崩溃请查看 logs 目录。</li>
        </ol>
      </details>
    </section>
  </main>

  <!-- SECTION: footer -->
  <footer class="foot">
    <div class="foot-in">
      <p><span id="foot-text">© LastShark</span> · <span id="year">2026</span></p>
