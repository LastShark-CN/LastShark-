<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片墙 · LastShark</title>
<meta name="description" content="不规则错落排布的照片墙，左右滑动浏览，点击照片打开独立预览窗。">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
</head>
<body data-page="photos">

<!-- SECTION: bg-markup -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="bg-fallback" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquidWarp">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="shell">

  <nav class="crumbs rv" aria-label="面包屑">
    <a href="index.html">首页</a><i>/</i><span id="crumb-title">照片墙</span>
  </nav>

  <main>
    <!-- SECTION: photo-wall -->
    <section id="photos">
      <div class="sec-head rv">
        <div>
          <div class="sec-kicker">Photo Wall</div>
          <h2 class="sec-title">照片墙</h2>
        </div>
        <p class="sec-note">不规则错落排布，可拖拽、滚轮或点击两侧按钮左右滑动。点击照片不会跳转页面，只在本页打开预览窗。</p>
        <span class="placeholder-flag" id="wall-count">照片位待替换</span>
      </div>

      <div class="wall-tools rv rv-d1">
        <span class="wall-hint">← 拖动 / 滑动浏览 →</span>
        <div class="wall-nav">
          <button class="round-btn" type="button" id="wall-prev" aria-label="向左滚动">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="round-btn" type="button" id="wall-next" aria-label="向右滚动">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="wall-viewport rv rv-d1" id="wall-viewport" tabindex="0" role="group" aria-label="照片墙横向滚动区，可用左右方向键滚动">
        <div class="wall-track" id="wall-track"></div>
      </div>

      <div class="wall-progress rv rv-d2"><i id="wall-bar"></i></div>
    </section>
  </main>

  <!-- SECTION: footer -->
  <footer class="foot">
    <div class="foot-in">
      <p><span id="foot-text">© LastShark</span> · <span id="year">2026</span></p>
      <div class="foot-links">
        <a href="index.html">首页</a>
        <a href="articles.html">文章</a>
        <a href="mods.html">模组</a>
        <a href="games.html">小游戏</a>
      </div>
    </div>
  </footer>
</div>

<!-- SECTION: nav-dock -->
<nav class="dock" id="dock" aria-label="主导航">
  <div class="dock-glass" aria-hidden="true"></div>
  <div class="dock-list" id="dock-list">
    <i class="dock-ind" id="dock-ind" aria-hidden="true"></i>
    <button class="nav-item" type="button" data-target="home" data-href="index.html">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 19z"/><path d="M10 20v-5h4v5"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" type="button" data-target="photos" data-href="photos.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.4"/><circle cx="9" cy="10.2" r="1.7"/><path d="M4.4 17.2l4.8-3.8 3.6 2.8 2.8-2 3.9 3"/></svg>
      <span>照片墙</span>
    </button>
    <button class="nav-item" type="button" data-target="articles" data-href="articles.html">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.6 3.7V7.4h3.6"/><path d="M9 12h7M9 15.6h5"/></svg>
      <span>文章</span>
    </button>
    <button class="nav-item" type="button" data-target="mods" data-href="mods.html">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.4v9.2L12 21l-8-4.4V7.4z"/><path d="M4 7.4l8 4.4 8-4.4M12 11.8V21"/></svg>
      <span>模组</span>
    </button>
    <button class="nav-item" type="button" data-target="games" data-href="games.html">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="19" height="10" rx="4.2"/><path d="M7 10.8v3.4M5.3 12.5h3.4"/><circle cx="16" cy="11.6" r="1.05"/><circle cx="18.2" cy="14" r="1.05"/></svg>
      <span>小游戏</span>
    </button>
  </div>
</nav>

<!-- SECTION: back-to-top -->
<button class="to-top" type="button" id="to-top" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<!-- SECTION: lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片预览窗">
  <button class="round-btn lb-close" type="button" id="lb-close" aria-label="关闭预览">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="round-btn lb-nav prev" type="button" id="lb-prev" aria-label="上一张">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="lb-inner" id="lb-inner">
    <div class="lb-stage" id="lb-stage"></div>
    <div class="lb-cap" id="lb-cap"></div>
  </div>
  <button class="round-btn lb-nav next" type="button" id="lb-next" aria-label="下一张">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-count" id="lb-count">01 / 14</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/lightbox.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/background.js"></script>
</body>
</html>
